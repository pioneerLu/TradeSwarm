[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeswarm"
version = "0.1.0"
description = "Multi-agent trading research and backtesting system built on LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "openai>=1.0.0",
    "httpx>=0.28.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "chromadb>=1.0.0",
    "yfinance>=0.2.0",
    "flask>=3.0.0",
    "requests>=2.30.0",
    "beautifulsoup4>=4.12.0",
    "typer>=0.9.0",
    "tqdm>=4.60.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

# Local embedding models (e.g., BGE) for ChromaDB
embeddings = [
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.23.0",
]

# Baseline backtest equity curves (scripts/experimental/run_baseline_strategies_backtest.py)
plot = [
    "matplotlib>=3.7.0",
]

# Pretty report PDF export (report.html -> report.pdf)
pdf = [
    "weasyprint",
]

# Alternative PDF backend (Chromium print-to-PDF; easier on Windows)
pdf_playwright = [
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
include = ["tradingagents*", "datasources*", "db_viewer*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
